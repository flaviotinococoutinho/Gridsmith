<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; img-src 'self' data:"
    />
    <title>Gridsmith</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header id="toolbar">
      <div class="toolbar-group" role="toolbar" aria-label="Projeto">
        <button id="btn-new">Novo</button>
        <button id="btn-open">Abrir…</button>
        <button id="btn-save">Salvar</button>
        <button id="btn-close">Fechar</button>
      </div>
      <span id="project-title" aria-live="polite">Nenhum projeto aberto</span>
      <span class="toolbar-spacer"></span>
      <span id="runtime-label">Runtime desconectado</span>
      <span id="connection-dot" class="dot offline" title="Estado da conexão"></span>
    </header>

    <main id="workbench">
      <nav id="panel-rail" aria-label="Painéis do editor"></nav>
      <div
        id="resize-rail"
        class="resizer vertical"
        role="separator"
        aria-orientation="vertical"
        aria-label="Redimensionar o rail de painéis"
      ></div>

      <section id="workspace">
        <div id="error-banner" role="alert" hidden></div>
        <div id="view-host" role="region" aria-label="Área de trabalho"></div>
        <div
          id="resize-bottom"
          class="resizer horizontal"
          role="separator"
          aria-orientation="horizontal"
          aria-label="Redimensionar o painel inferior"
        ></div>
        <section id="bottom-panel">
          <div id="bottom-tabs" role="tablist" aria-label="Painéis inferiores">
            <button role="tab" data-tab="problems">Problemas <span id="problem-count" class="badge">0</span></button>
            <button role="tab" data-tab="output">Saída</button>
            <button role="tab" data-tab="history">Histórico</button>
            <input id="log-filter" type="search" placeholder="Filtrar…" aria-label="Filtrar log" />
          </div>
          <div id="bottom-content" role="tabpanel" tabindex="0"></div>
        </section>
      </section>

      <div
        id="resize-inspector"
        class="resizer vertical"
        role="separator"
        aria-orientation="vertical"
        aria-label="Redimensionar o inspector"
      ></div>
      <aside id="inspector" aria-label="Inspector">
        <h2>Inspector</h2>
        <div id="inspector-content"><p class="muted">Nada selecionado.</p></div>
      </aside>
    </main>

    <footer id="status-bar" aria-live="polite">
      <span id="status-project">Nenhum projeto aberto</span>
      <span id="status-connection">Conectando ao middleware…</span>
      <span id="status-runtime"></span>
      <span id="status-services"></span>
    </footer>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
