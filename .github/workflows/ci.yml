name: CI

on:
  push:
    branches: ["main", "claude/**", "codex/**"]
  pull_request:

jobs:
  middleware:
    name: Middleware (Node.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: middleware
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: middleware/package-lock.json
      - run: npm ci
      - run: npm run build
      # A suíte de sockets deve terminar em segundos; o limite impede que um
      # handle/promessa vazado consuma o runner sem produzir diagnóstico.
      - run: timeout --signal=TERM 90s npm test
      - name: Teste explícito — sessão transacional e journal particionado
        run: npm run test:project-session
      - name: Teste explícito — paridade de sessão nas três bordas
        run: npm run test:project-session-transports
      # O exemplo versionado é SERIALIZADO pelo middleware; editá-lo à mão o
      # faria divergir do gerador em silêncio, e a próxima regeneração
      # apagaria a edição.
      - name: Exemplo versionado bate com o gerador
        run: node ../scripts/make-example-project.mjs --check

  frontend:
    name: Frontend (Editor core)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            middleware/package-lock.json
            frontend/package-lock.json
      - run: cd middleware && npm ci && npm run build
      - run: cd frontend && npm ci && npm run build
      - run: cd frontend && npm test
      - name: Teste explícito — clientes observam troca atômica de projeto
        run: cd frontend && npm run test:project-session
      - name: Teste explícito — fallback gRPC → GraphQL
        run: cd frontend && npm run test:transport-fallback
      - name: Teste explícito — repromoção GraphQL → gRPC
        run: cd frontend && npm run test:transport-repromotion
      - name: Teste explícito — autenticação não provoca fallback
        run: cd frontend && npm run test:transport-auth
      - name: Teste explícito — gap do EventJournal exige resync
        run: cd frontend && npm run test:transport-journal-gap
      - name: Teste explícito — reinício completo do middleware
        run: cd frontend && npm run test:transport-middleware-restart

  engine:
    name: Engine (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet build --nologo
      - run: dotnet test --no-build --nologo
      - name: Teste explícito — reset integral da sessão de runtime
        run: dotnet test --no-build --nologo --filter FullyQualifiedName~EngineSessionResetTests

  docs:
    name: Documentação (anti-drift)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run docs:verify
      # A arte do exemplo é gerada, não coletada: se o PNG do repositório
      # deixar de bater com o gerador, ele passou a ter origem desconhecida.
      - name: Atlas do exemplo bate com o gerador
        run: node scripts/make-example-atlas.mjs --check

  e2e:
    name: Verificação ponta-a-ponta (Fases 1–4 + transports)
    runs-on: ubuntu-latest
    needs: [middleware, frontend, engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            middleware/package-lock.json
            frontend/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      # O build antes do npm ci do frontend garante que a dependência local
      # file:../middleware seja empacotada com dist/ e os contratos copiados.
      - run: cd middleware && npm ci && npm run build
      - run: cd frontend && npm ci
      - run: ./scripts/verify-phase1.sh
      - run: ./scripts/verify-phase2.sh
      - run: ./scripts/verify-phase3.sh
      - run: ./scripts/verify-phase4.sh
      - run: ./scripts/verify-transports.sh
      - run: ./scripts/verify-visual-parity.sh
