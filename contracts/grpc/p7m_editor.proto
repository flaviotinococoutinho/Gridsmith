// Contrato gRPC do caminho QUENTE do editor (transporte prioritário do app).
// Fonte de verdade: este arquivo; middleware e frontend o carregam em runtime
// via @grpc/proto-loader (cópia em dist/ verificada por teste de paridade).
//
// Decisão de modelagem (ADR-017): envelope TIPADO + payload JSON. Os comandos
// canônicos já têm validação única no BlueprintStore e schemas JSON em
// contracts/schemas/ — duplicar os 14 comandos como messages protobuf criaria
// uma segunda fonte de verdade de validação. Canal HTTP/2 persistente e
// STREAMING são hipóteses medidas pelo benchmark da ADR-019; o proto não
// presume ganho de desempenho nem re-tipa payloads que a borda não valida.
//
// Endpoints (mesma convenção do plano de controle):
//   POSIX   -> unix:$XDG_RUNTIME_DIR/<pipe>-grpc.sock
//   Windows -> 127.0.0.1:<porta derivada do nome> (grpc-js não suporta named pipes)
syntax = "proto3";

package p7m.editor.v1;

service EditorHotPath {
  // Liveness/prontidão do transporte (usada pelo TransportRouter na recovery).
  rpc Health(HealthRequest) returns (HealthReply);
  // Dispatch canônico: filters -> AST -> actions -> projeção (mesmo caminho da UI/MCP).
  rpc Dispatch(DispatchRequest) returns (DispatchReply);
  // Projeções de leitura do Blueprint (levels, entities, document, ...).
  rpc Query(QueryRequest) returns (QueryReply);
  // Snapshot completo de todas as projeções carimbado com cursor coerente.
  rpc Snapshot(SnapshotRequest) returns (SnapshotReply);
  // Stream legado mantido até clientes migrarem para o cursor composto.
  rpc StreamEvents(StreamEventsRequest) returns (stream EventEnvelope);
  // Primeiro frame é status; eventos só seguem quando não exige resync.
  rpc StreamEventsV2(EventCursorRequest) returns (stream EventStreamFrame);
}

message HealthRequest {}

message HealthReply {
  bool ok = 1;
  bool engine_connected = 2;
  uint64 last_event_seq = 3;
  string middleware_instance_id = 4;
  uint64 first_available_seq = 5;
}

message DispatchRequest {
  // Kind canônico com namespace/verbo (ex.: "level/update") — exatamente
  // COMMAND_KINDS; kinds fora da lista são rejeitados na borda.
  string kind = 1;
  // Payload do comando serializado em JSON UTF-8 (validado no BlueprintStore).
  string payload_json = 2;
  // Idempotência entre gRPC e fallback GraphQL; UUID gerado pelo EditorClient.
  string request_id = 3;
}

message DispatchReply {
  // Evento canônico emitido (JSON UTF-8).
  string event_json = 1;
  // ProjectionResult (JSON UTF-8); vazio quando não há adapter.
  string projection_json = 2;
}

message QueryRequest {
  // Nome da projeção: skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document.
  string projection = 1;
}

message QueryReply {
  string result_json = 1;
}

message SnapshotRequest {}

message SnapshotReply {
  // Mapa JSON com skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document.
  string projections_json = 1;
  string middleware_instance_id = 2;
  uint64 first_available_seq = 3;
  uint64 last_event_seq = 4;
}

message StreamEventsRequest {
  // Reentrega eventos com seq > after_seq antes de passar ao vivo.
  uint64 after_seq = 1;
}

message EventCursorRequest {
  uint64 after_seq = 1;
  // Parte obrigatória do cursor; muda em todo processo do middleware.
  string middleware_instance_id = 2;
}

message EventEnvelope {
  uint64 seq = 1;
  string kind = 2;
  string payload_json = 3;
}

message EventStreamStatus {
  string middleware_instance_id = 1;
  uint64 first_available_seq = 2;
  uint64 last_event_seq = 3;
  bool resync_required = 4;
  // "", instance_changed, journal_gap, cursor_ahead ou invalid_cursor.
  string resync_reason = 5;
}

message EventStreamFrame {
  oneof frame {
    EventStreamStatus status = 1;
    EventEnvelope event = 2;
  }
}
