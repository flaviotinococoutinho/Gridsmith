// Contrato gRPC do caminho QUENTE do editor (transporte prioritário do app).
// Fonte de verdade: este arquivo; middleware e frontend o carregam em runtime
// via @grpc/proto-loader (cópia em dist/ verificada por teste de paridade).
//
// Decisão de modelagem (ADR-017): envelope TIPADO + payload JSON. Os comandos
// canônicos já têm validação única no BlueprintStore e schemas JSON em
// contracts/schemas/ — duplicar os 14 comandos como messages protobuf criaria
// uma segunda fonte de verdade de validação. Canal HTTP/2 persistente e
// STREAMING são hipóteses medidas pelo benchmark da ADR-019; o proto não
// presume ganho de desempenho nem re-tipa payloads que a borda não valida.
//
// Endpoints (mesma convenção do plano de controle):
//   POSIX   -> unix:$XDG_RUNTIME_DIR/<pipe>-grpc.sock
//   Windows -> 127.0.0.1:<porta derivada do nome> (grpc-js não suporta named pipes)
syntax = "proto3";

package gridsmith.editor.v1;

service EditorHotPath {
  // Liveness/prontidão do transporte (usada pelo TransportRouter na recovery).
  rpc Health(HealthRequest) returns (HealthReply);
  // Dispatch canônico: filters -> AST -> actions -> projeção (mesmo caminho da UI/MCP).
  rpc Dispatch(DispatchRequest) returns (DispatchReply);
  // Projeções de leitura do Blueprint (levels, entities, document, ...).
  rpc Query(QueryRequest) returns (QueryReply);
  // Snapshot completo de todas as projeções carimbado com cursor coerente.
  rpc Snapshot(SnapshotRequest) returns (SnapshotReply);
  // Operações transacionais da sessão de projeto (paridade com GraphQL/JSON-RPC).
  rpc ProjectCreate(ProjectCreateRequest) returns (ProjectOperationReply);
  rpc ProjectOpenDocument(ProjectOpenDocumentRequest) returns (ProjectOperationReply);
  rpc ProjectClose(ProjectCloseRequest) returns (ProjectStatusReply);
  rpc ProjectStatus(ProjectStatusRequest) returns (ProjectStatusReply);
  // Stream legado mantido até clientes migrarem para o cursor composto.
  rpc StreamEvents(StreamEventsRequest) returns (stream EventEnvelope) {
    option deprecated = true;
  }
  // Primeiro frame é status; eventos só seguem quando não exige resync.
  rpc StreamEventsV2(EventCursorRequest) returns (stream EventStreamFrame);
  // Histórico global: desfazer/refazer pelo MESMO caminho canônico, com
  // compare-and-swap por history_cursor.
  rpc Undo(HistoryMutationRequest) returns (HistoryOperationReply);
  rpc Redo(HistoryMutationRequest) returns (HistoryOperationReply);
  rpc HistoryStatus(HistoryStatusRequest) returns (HistoryStatusReply);
}

message HistoryMutationRequest {
  // Cursor que o cliente viu; vazio dispensa o compare-and-swap.
  string expected_history_cursor = 1;
  string expected_project_session_id = 2;
}

message HistoryStatusRequest {
  uint32 limit = 1;
}

message HistoryEntrySummary {
  string id = 1;
  string label = 2;
  // human|agent|pipeline
  string actor = 3;
  uint64 timestamp_unix_ms = 4;
  bool barrier = 5;
  // true para as entradas já desfeitas (o ramo do redo).
  bool undone = 6;
}

message HistoryStatusReply {
  string document_state_id = 1;
  string history_cursor = 2;
  bool can_undo = 3;
  bool can_redo = 4;
  string undo_label = 5;
  string redo_label = 6;
  repeated HistoryEntrySummary entries = 7;
}

message HistoryOperationReply {
  // apply|undo|redo
  string action = 1;
  string history_entry_id = 2;
  string label = 3;
  // Um gesto desfeito publica N eventos, um por comando inverso.
  repeated EventEnvelope events = 4;
  string document_state_id = 5;
  string history_cursor = 6;
}

message HealthRequest {}

message HealthReply {
  bool ok = 1;
  bool engine_connected = 2;
  uint64 last_event_seq = 3;
  string middleware_instance_id = 4;
  uint64 first_available_seq = 5;
  string project_session_id = 6;
  string project_id = 7;
  uint64 command_sequence = 8;
  ProjectStatusReply project_status = 9;
}

message DispatchRequest {
  // Kind canônico com namespace/verbo (ex.: "level/update") — exatamente
  // COMMAND_KINDS; kinds fora da lista são rejeitados na borda.
  string kind = 1;
  // Payload do comando serializado em JSON UTF-8 (validado no BlueprintStore).
  string payload_json = 2;
  // Idempotência entre gRPC e fallback GraphQL; UUID gerado pelo EditorClient.
  string request_id = 3;
}

message DispatchReply {
  // Evento canônico emitido (JSON UTF-8).
  string event_json = 1;
  // ProjectionResult (JSON UTF-8); vazio quando não há adapter.
  string projection_json = 2;
}

message QueryRequest {
  // Nome da projeção: skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document.
  string projection = 1;
}

message QueryReply {
  string result_json = 1;
}

message SnapshotRequest {}

message SnapshotReply {
  // Mapa JSON com skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document.
  string projections_json = 1;
  string middleware_instance_id = 2;
  uint64 first_available_seq = 3;
  uint64 last_event_seq = 4;
  string project_session_id = 5;
  string project_id = 6;
  uint64 command_sequence = 7;
  ProjectStatusReply project_status = 8;
}

message ProjectCreateRequest {
  // Vazio gera um projectId no middleware.
  string project_id = 1;
  // Vazio cria uma sessão sem comandos; preenchido prepara o template primeiro.
  string template_id = 2;
  // Compare-and-swap: recusa substituir uma sessão diferente da observada.
  string expected_project_session_id = 3;
}

message ProjectOpenDocumentRequest {
  string document_json = 1;
  // Compare-and-swap: recusa candidato preparado sobre sessão obsoleta.
  string expected_project_session_id = 2;
}

message ProjectCloseRequest {
  // Evita que um cliente atrasado feche uma sessão que já foi substituída.
  string expected_project_session_id = 1;
}

message ProjectStatusRequest {}

message ReplaySummary {
  uint32 applied = 1;
  uint32 projected = 2;
  uint32 deferred = 3;
  uint32 skipped = 4;
}

message ProjectStatusReply {
  bool active = 1;
  string project_session_id = 2;
  string project_id = 3;
  uint64 command_sequence = 4;
  uint64 created_at_unix_ms = 5;
  // synchronized|deferred|failed
  string runtime_state = 6;
  // Identidade lógica do conteúdo e posição no histórico (documento v4).
  string document_state_id = 7;
  string history_cursor = 8;
  bool can_undo = 9;
  bool can_redo = 10;
}

message ProjectOperationReply {
  ProjectStatusReply status = 1;
  // Resumo do replay/projeção; zero para create vazio.
  ReplaySummary summary = 2;
  string template_id = 3;
  string name = 4;
}

message StreamEventsRequest {
  // Reentrega eventos com seq > after_seq antes de passar ao vivo.
  uint64 after_seq = 1;
}

message EventCursorRequest {
  uint64 after_seq = 1;
  // Parte obrigatória do cursor; muda em todo processo do middleware.
  string middleware_instance_id = 2;
  // Parte obrigatória do cursor; muda em toda troca de projeto.
  string project_session_id = 3;
}

message EventEnvelope {
  uint64 seq = 1;
  string kind = 2;
  string payload_json = 3;
  string project_session_id = 4;
  string project_id = 5;
  uint64 command_sequence = 6;
  // Resultado da aplicação no runtime. Metadado de transporte: viaja no
  // envelope, nunca dentro do evento canônico. Ausente (has_projection=false)
  // em eventos de controle e quando não há adapter.
  bool has_projection = 7;
  // "", projected, skipped ou deferred.
  string projection_status = 8;
  // Razão acionável quando o status é skipped ou deferred.
  string projection_reason = 9;

  // --- Trilha do histórico (documento v4) ---------------------------------
  // Os campos 1-9 acima são IMUTÁVEIS: já foram publicados e um cliente
  // antigo os decodifica por número. Todo campo de histórico entra a partir
  // do 10 — reaproveitar 7/8/9 não seria conflito de texto, seria
  // incompatibilidade BINÁRIA: o proto3 decodificaria um campo como o outro
  // em silêncio, e um build intermediário leria `projection_status` onde o
  // outro escreveu `transaction_id`.
  //
  // Agrupa os comandos de UM gesto do usuário (um arrasto = uma entrada).
  string transaction_id = 10;
  // Identidade lógica do conteúdo; VOLTA ao valor anterior no undo.
  string document_state_id = 11;
  // Entrada desfazível a que este evento pertence.
  string history_entry_id = 12;
  // Proveniência: human, agent ou pipeline.
  string actor = 13;
  // apply, undo ou redo.
  string history_action = 14;
  // Posição no histórico, como string (CAS do undo/redo).
  string history_cursor = 15;
}

message EventStreamStatus {
  string middleware_instance_id = 1;
  uint64 first_available_seq = 2;
  uint64 last_event_seq = 3;
  bool resync_required = 4;
  // "", instance_changed, project_session_changed, journal_gap,
  // cursor_ahead ou invalid_cursor.
  string resync_reason = 5;
  string project_session_id = 6;
  string project_id = 7;
  uint64 command_sequence = 8;
}

message EventStreamFrame {
  oneof frame {
    EventStreamStatus status = 1;
    EventEnvelope event = 2;
  }
}
