# Contrato GraphQL do gateway do editor (superfície COMPLETA, transporte de
# fallback do app). Fonte de verdade deste SDL: este arquivo; o middleware o
# carrega em runtime (cópia em dist/ verificada por teste de paridade).
#
# Semântica: fachada fina sobre a MESMA EditorSurface e sessão ativa usadas por
# JSON-RPC, gRPC e MCP — nenhuma lógica de domínio vive aqui.
# Mutações genéricas preservam a regra R8 (todo comando canônico despachável
# pelas bordas); payloads são validados no BlueprintStore, nunca na borda.
#
# Eventos: sem subscription — o fallback usa polling incremental por cursor
# composto `(middlewareInstanceId, projectSessionId, afterSeq)`. `seq` e
# `commandSequence` são strings decimais para não herdar o limite de 32 bits do
# GraphQL Int. O caminho quente pertence ao gRPC.

"Payload/resultado JSON arbitrário validado pelo domínio (não pela borda)."
scalar JSON

"Kinds canônicos — DEVE espelhar COMMAND_KINDS (teste de paridade impõe)."
enum CommandKind {
  skeleton_define
  mesh_bind
  camera_configure
  light_add
  light_remove
  entitydef_define
  entity_place
  entity_move
  entity_remove
  level_define
  level_update
  level_remove
  world_place
  world_unplace
}

"Status de projeção no runtime (ProjectionResult do RuntimeAdapter)."
enum ProjectionStatus {
  projected
  skipped
  deferred
}

type Projection {
  event: String!
  status: ProjectionStatus!
  reason: String
  detail: JSON
}

type DispatchResult {
  "Evento canônico emitido pelo BlueprintStore (kind + payload)."
  event: JSON!
  "Resultado da projeção no runtime; null quando não há adapter."
  projection: Projection
}

type BlueprintEventEnvelope {
  "Sequência legada limitada ao GraphQL Int; mantida apenas para introspecção."
  seq: Int!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  kind: String!
  payload: JSON!
}

"Evento seguro para cursores longos; seq é decimal uint64."
type CursorEventEnvelope {
  seq: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  kind: String!
  payload: JSON!
}

"Janela incremental do EventJournal; events é vazio quando resyncRequired."
type EventBatch {
  middlewareInstanceId: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  firstAvailableSeq: String!
  lastEventSeq: String!
  resyncRequired: Boolean!
  "instance_changed|project_session_changed|journal_gap|cursor_ahead|invalid_cursor"
  resyncReason: String
  events: [CursorEventEnvelope!]!
}

"Todas as projeções nomeadas capturadas com o cursor no mesmo turno síncrono."
type EditorSnapshot {
  "Mapa skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document."
  projections: JSON!
  status: ProjectStatus!
  middlewareInstanceId: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  firstAvailableSeq: String!
  lastEventSeq: String!
}

type FeatureDecision {
  feature: String!
  enabled: Boolean!
  source: String!
  reason: String!
}

type Experience {
  family: String!
  requestedVersion: String!
  profileVersion: String!
  displayName: String!
  capabilities: [String!]!
  constraints: JSON!
  decisions: [FeatureDecision!]!
  liveManifestConsidered: Boolean!
}

type ProjectTemplate {
  id: String!
  label: String!
  description: String!
}

type ReplaySummary {
  applied: Int!
  projected: Int!
  deferred: Int!
  skipped: Int!
}

type NewProjectResult {
  templateId: String!
  name: String!
  applied: Int!
  projected: Int!
  deferred: Int!
  skipped: Int!
}

"Identidade e progresso da sessão ativa; ids são null quando não há projeto aberto."
type ProjectStatus {
  active: Boolean!
  projectSessionId: String
  projectId: String
  commandSequence: String!
  createdAt: String
  "synchronized|deferred|failed"
  runtimeState: String!
}

"Resultado uniforme das operações transacionais de projeto."
type ProjectOperationResult {
  status: ProjectStatus!
  "Resumo do replay/projeção; zero para create vazio."
  summary: ReplaySummary!
  templateId: String
  name: String
}

type Health {
  ok: Boolean!
  engineConnected: Boolean!
  middlewareInstanceId: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  "Primeiro seq ainda disponível para catch-up (decimal uint64)."
  firstAvailableSeq: String!
  "Último seq publicado no EventJournal (decimal uint64)."
  lastEventSeq: String!
}

type Query {
  health: Health!
  "Projeções de leitura do Blueprint: skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document."
  projection(name: String!): JSON!
  "Snapshot completo para conexão inicial e ressincronização explícita."
  snapshot: EditorSnapshot!
  "Matriz de decisões da governança de experiência."
  experience(family: String, version: String): Experience!
  templates: [ProjectTemplate!]!
  "Sessão de projeto observada por todos os transports."
  projectStatus: ProjectStatus!
  "Janela segura; projectSessionId opcional só para compatibilidade, omiti-lo exige resync."
  eventBatch(middlewareInstanceId: String!, projectSessionId: String, afterSeq: String!): EventBatch!
  "Compatibilidade nominal; falha explicitamente porque não identifica processo nem sessão."
  eventsSince(afterSeq: Int!): [BlueprintEventEnvelope!]!
    @deprecated(reason: "Use eventBatch com middlewareInstanceId, projectSessionId e resyncRequired")
}

type Mutation {
  "Despacha um comando canônico pelo orquestrador (filters → AST → actions → projeção)."
  dispatch(kind: CommandKind!, payload: JSON!, requestId: String): DispatchResult!
  "Cria e ativa, atomicamente, uma sessão vazia ou baseada em template."
  projectCreate(projectId: String, templateId: String, expectedProjectSessionId: String): ProjectOperationResult!
  "Prepara o documento fora da sessão ativa e só então a substitui atomicamente."
  projectOpenDocument(document: JSON!, expectedProjectSessionId: String): ProjectOperationResult!
  "Fecha somente a sessão esperada, quando informada."
  projectClose(expectedProjectSessionId: String): ProjectStatus!
  "Alias legado transacional de projectOpenDocument."
  loadDocument(document: JSON!, expectedProjectSessionId: String): ReplaySummary!
  "Alias legado transacional de projectCreate(templateId: ...)."
  newProjectFromTemplate(templateId: String!, expectedProjectSessionId: String): NewProjectResult!
}
