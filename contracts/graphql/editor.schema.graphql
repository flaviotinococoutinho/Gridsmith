# Contrato GraphQL do gateway do editor (superfície COMPLETA, transporte de
# fallback do app). Fonte de verdade deste SDL: este arquivo; o middleware o
# carrega em runtime (cópia em dist/ verificada por teste de paridade).
#
# Semântica: fachada fina sobre a MESMA EditorSurface e sessão ativa usadas por
# JSON-RPC, gRPC e MCP — nenhuma lógica de domínio vive aqui.
# Mutações genéricas preservam a regra R8 (todo comando canônico despachável
# pelas bordas); payloads são validados no BlueprintStore, nunca na borda.
#
# Eventos: sem subscription — o fallback usa polling incremental por cursor
# composto `(middlewareInstanceId, projectSessionId, afterSeq)`. `seq` e
# `commandSequence` são strings decimais para não herdar o limite de 32 bits do
# GraphQL Int. O caminho quente pertence ao gRPC.

"Payload/resultado JSON arbitrário validado pelo domínio (não pela borda)."
scalar JSON

"Kinds canônicos — DEVE espelhar COMMAND_KINDS (teste de paridade impõe)."
enum CommandKind {
  skeleton_define
  mesh_bind
  camera_configure
  light_add
  light_remove
  entitydef_define
  entity_place
  entity_move
  entity_remove
  entity_properties
  entitydef_update
  entitydef_remove
  level_define
  level_update
  level_patch
  level_palette
  level_remove
  light_update
  world_place
  world_unplace
}

"Proveniência confiável atribuída pela borda; nunca aceita do payload do cliente."
enum HistoryActor {
  human
  agent
  pipeline
}

"Motivo pelo qual os comandos de uma entrada estão sendo publicados."
enum HistoryAction {
  apply
  undo
  redo
}

"Uma transação reversível do histórico global da sessão."
type HistoryEntry {
  id: String!
  label: String!
  forward: [JSON!]!
  inverse: [JSON!]!
  actor: HistoryActor!
  transactionId: String!
  "Decimal unix-ms para não perder precisão."
  timestamp: String!
  barrier: Boolean!
}

"Resumo seguro para menus/listas; os comandos completos ficam no ACK da operação."
type HistoryEntrySummary {
  id: String!
  label: String!
  actor: HistoryActor!
  transactionId: String!
  timestamp: String!
  barrier: Boolean!
  applied: Boolean!
}

"Cursor do histórico e identidade do documento materializado nesse cursor."
type HistoryStatus {
  projectSessionId: String!
  projectId: String!
  canUndo: Boolean!
  canRedo: Boolean!
  undoLabel: String
  redoLabel: String
  "Hash/id estável do estado, independente do relógio monotônico de comandos."
  documentStateId: String!
  "Cursor opaco de compare-and-swap para undo/redo concorrente."
  historyCursor: String!
  commandSequence: String!
  entries: [HistoryEntrySummary!]!
}

type HistoryList {
  status: HistoryStatus!
  entries: [HistoryEntrySummary!]!
}

"ACK de undo/redo; todos os eventos já foram confirmados antes deste retorno."
type HistoryOperationResult {
  status: ProjectStatus!
  history: HistoryStatus!
  entry: HistoryEntry!
  events: [JSON!]!
  commandSequence: String!
  transactionId: String!
  documentStateId: String!
  historyCursor: String!
}

"Status de projeção no runtime (ProjectionResult do RuntimeAdapter)."
enum ProjectionStatus {
  projected
  skipped
  deferred
}

type Projection {
  event: String!
  status: ProjectionStatus!
  reason: String
  detail: JSON
}

type DispatchResult {
  "Evento canônico emitido pelo BlueprintStore (kind + payload)."
  event: JSON!
  "Resultado da projeção no runtime; null quando não há adapter."
  projection: Projection
  "Relógio monotônico confirmado no mesmo ACK."
  commandSequence: String!
  transactionId: String!
  documentStateId: String!
  historyCursor: String!
  historyEntry: HistoryEntry
}

type BlueprintEventEnvelope {
  "Sequência legada limitada ao GraphQL Int; mantida apenas para introspecção."
  seq: Int!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  transactionId: String
  documentStateId: String
  historyEntryId: String
  actor: HistoryActor
  historyCursor: String
  historyAction: HistoryAction
  kind: String!
  payload: JSON!
}

"Evento seguro para cursores longos; seq é decimal uint64."
type CursorEventEnvelope {
  seq: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  transactionId: String
  documentStateId: String
  historyEntryId: String
  actor: HistoryActor
  historyCursor: String
  historyAction: HistoryAction
  kind: String!
  payload: JSON!
  "Presente somente para eventos operacionais domain=asset; payload permanece por compatibilidade."
  application: EditorApplicationEvent
}

"Janela incremental do EventJournal; events é vazio quando resyncRequired."
type EventBatch {
  middlewareInstanceId: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  firstAvailableSeq: String!
  lastEventSeq: String!
  resyncRequired: Boolean!
  "instance_changed|project_session_changed|journal_gap|cursor_ahead|invalid_cursor"
  resyncReason: String
  events: [CursorEventEnvelope!]!
}

"Todas as projeções nomeadas capturadas com o cursor no mesmo turno síncrono."
type EditorSnapshot {
  "Mapa skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document."
  projections: JSON!
  status: ProjectStatus!
  middlewareInstanceId: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  documentStateId: String!
  historyCursor: String!
  history: HistoryStatus!
  firstAvailableSeq: String!
  lastEventSeq: String!
}

type FeatureDecision {
  feature: String!
  enabled: Boolean!
  source: String!
  reason: String!
}

type Experience {
  family: String!
  requestedVersion: String!
  profileVersion: String!
  displayName: String!
  capabilities: [String!]!
  constraints: JSON!
  decisions: [FeatureDecision!]!
  liveManifestConsidered: Boolean!
}

type ProjectTemplate {
  id: String!
  label: String!
  description: String!
  "Preview declarativo renderizado pelo wizard; não contém caminho local."
  preview: JSON!
  "Resolução de referência e tile size sugeridos pelo template."
  defaults: JSON!
}

input ReferenceResolutionInput {
  width: Int!
  height: Int!
}

"Opções completas; materializações nunca reutilizam a identidade fixa do catálogo."
input ProjectTemplateOptionsInput {
  projectId: String!
  name: String!
  referenceResolution: ReferenceResolutionInput!
  tileSize: Int!
}

type ReplaySummary {
  applied: Int!
  projected: Int!
  deferred: Int!
  skipped: Int!
}

type NewProjectResult {
  templateId: String!
  name: String!
  applied: Int!
  projected: Int!
  deferred: Int!
  skipped: Int!
}

"Identidade e progresso da sessão ativa; ids são null quando não há projeto aberto."
type ProjectStatus {
  active: Boolean!
  projectSessionId: String
  projectId: String
  commandSequence: String!
  documentStateId: String!
  historyCursor: String!
  canUndo: Boolean!
  canRedo: Boolean!
  createdAt: String
  "synchronized|deferred|failed"
  runtimeState: String!
}

"Resultado uniforme das operações transacionais de projeto."
type ProjectOperationResult {
  status: ProjectStatus!
  "Resumo do replay/projeção; zero para create vazio."
  summary: ReplaySummary!
  templateId: String
  name: String
}

type Health {
  ok: Boolean!
  engineConnected: Boolean!
  middlewareInstanceId: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  documentStateId: String!
  historyCursor: String!
  "Primeiro seq ainda disponível para catch-up (decimal uint64)."
  firstAvailableSeq: String!
  "Último seq publicado no EventJournal (decimal uint64)."
  lastEventSeq: String!
}

"Filtro do catalogo de assets. Todos os campos sao combinados por AND."
input AssetCatalogFilterInput {
  search: String
  tags: [String!]
  directory: String
}

"Asset importavel mais recente; caminhos sao locais e nunca aceitos como HTML."
type AssetSummary {
  assetId: String!
  kind: String!
  name: String!
  revision: Int!
  sourcePath: String!
  directory: String!
  tags: [String!]!
  thumbnailPath: String
  "Preview seguro para renderer (data:image/...); nunca file://."
  thumbnailDataUrl: String
  spritesheetPng: String
  compiledXnb: String
  clipCount: Int!
  "Decimal unix-ms para evitar o limite de 32 bits do GraphQL Int."
  updatedAt: String!
}

type AssetCatalogResult {
  projectSessionId: String!
  projectId: String!
  assets: [AssetSummary!]!
  tags: [String!]!
  directories: [String!]!
}

type AssetSpriteFrame {
  index: Int!
  x: Int!
  y: Int!
  w: Int!
  h: Int!
  durationMs: Int!
}

enum AssetClipDirection {
  forward
  reverse
  pingpong
}

type AssetAnimationClip {
  name: String!
  from: Int!
  to: Int!
  direction: AssetClipDirection!
  playback: [Int!]!
  durationMs: Int!
}

type AssetRect {
  x: Int!
  y: Int!
  w: Int!
  h: Int!
}

type AssetPoint {
  x: Int!
  y: Int!
}

type AssetSpriteSlice {
  name: String!
  bounds: AssetRect!
  center: AssetRect
  pivot: AssetPoint
}

"Detalhes normalizados; frameTags e alias estavel de clips para clientes do Aseprite."
type AssetDetails {
  asset: AssetSummary!
  payload: JSON!
  frames: [AssetSpriteFrame!]!
  clips: [AssetAnimationClip!]!
  frameTags: [AssetAnimationClip!]!
  slices: [AssetSpriteSlice!]!
}

input AssetImportInput {
  sourcePath: String!
  targetDirectory: String
  tags: [String!]
  "Identificador opcional de correlacao e cancelamento fornecido pelo cliente; nao e chave de idempotencia duravel."
  operationId: String
}

enum AssetOperationStatus {
  accepted
  queued
  running
  completed
  cancelled
  failed
  ignored
}

enum AssetOperationKind {
  import
  reimport
}

"ACK tipado da operacao; detalhes especificos do importador permanecem em result."
type AssetOperationResult {
  operationId: String!
  operation: AssetOperationKind!
  projectSessionId: String!
  projectId: String!
  assetId: String
  status: AssetOperationStatus!
  message: String
}

type AssetRemoveResult {
  operationId: String!
  assetId: String!
  removed: Boolean!
  filesPreserved: Boolean!
  asset: AssetSummary!
}

enum AssetToolScope {
  project
  user
}

input AssetToolConfigurationInput {
  scope: AssetToolScope!
  asepritePath: String
  mgcbPath: String
}

enum AssetToolConfigurationSource {
  project
  user
  default
}

type AssetToolDetection {
  path: String!
  available: Boolean!
  version: String
  message: String!
  source: AssetToolConfigurationSource!
  "Decimal unix-ms."
  testedAt: String!
}

type AssetToolConfiguration {
  scope: AssetToolScope!
  projectId: String!
  asepritePath: String!
  mgcbPath: String!
  aseprite: AssetToolDetection!
  mgcb: AssetToolDetection!
  persisted: Boolean!
}

enum AssetRevealTarget {
  source
  output
}

"Referencia discriminada: exatamente um dos campos deve ser informado."
input AssetSourceReferenceInput {
  assetId: String
  operationId: String
}

type AssetRevealResult {
  operationId: String!
  assetId: String
  "Operacao de import que originou um diagnostico ainda sem assetId."
  sourceOperationId: String
  target: AssetRevealTarget!
  path: String!
  revealed: Boolean!
}

enum AssetCancellationStatus {
  cancellation_requested
  already_finished
  not_found
}

type AssetCancelResult {
  operationId: String!
  status: AssetCancellationStatus!
  cancelled: Boolean!
}

enum EditorApplicationEventSeverity {
  info
  warning
  error
}

"Evento operacional separado de BlueprintEvent/CommandHistory; compartilha EventJournal e cursor."
type EditorApplicationProgress {
  phase: String!
  current: Int!
  total: Int!
  percent: Int!
  message: String!
}

type EditorApplicationEvent {
  seq: String!
  projectSessionId: String!
  projectId: String!
  commandSequence: String!
  domain: String!
  kind: String!
  operationId: String
  progress: EditorApplicationProgress
  severity: EditorApplicationEventSeverity!
  payload: JSON!
  "Decimal unix-ms."
  timestamp: String!
}

type Query {
  health: Health!
  "Projeções de leitura do Blueprint: skeletons|meshes|lights|entityDefs|entities|camera|levels|world|document."
  projection(name: String!): JSON!
  "Snapshot completo para conexão inicial e ressincronização explícita."
  snapshot: EditorSnapshot!
  "Matriz de decisões da governança de experiência."
  experience(family: String, version: String): Experience!
  templates: [ProjectTemplate!]!
  "Materializa um documento válido sem ativar/trocar a sessão corrente."
  projectTemplateDocument(templateId: String!, options: ProjectTemplateOptionsInput!): JSON!
  "Sessão de projeto observada por todos os transports."
  projectStatus: ProjectStatus!
  "Estado pequeno usado por menus/atalhos globais, independente do painel ativo."
  historyStatus(limit: Int = 0): HistoryStatus!
  "Histórico legível da sessão ativa, mais recente primeiro."
  history(limit: Int = 100): HistoryList!
  "Catalogo completo/filtrado; baseline GraphQL para todos os transports do app."
  assetCatalog(filter: AssetCatalogFilterInput): AssetCatalogResult!
  assetDetails(assetId: String!): AssetDetails!
  "Janela segura; projectSessionId opcional só para compatibilidade, omiti-lo exige resync."
  eventBatch(middlewareInstanceId: String!, projectSessionId: String, afterSeq: String!): EventBatch!
  "Compatibilidade nominal; falha explicitamente porque não identifica processo nem sessão."
  eventsSince(afterSeq: Int!): [BlueprintEventEnvelope!]!
    @deprecated(reason: "Use eventBatch com middlewareInstanceId, projectSessionId e resyncRequired")
}

type Mutation {
  "Despacha um comando canônico pelo orquestrador (filters → AST → actions → projeção)."
  dispatch(kind: CommandKind!, payload: JSON!, requestId: String): DispatchResult!
  "Desfaz a entrada reversível mais recente; actor é atribuído pela borda."
  undo(requestId: String, expectedProjectSessionId: String, historyCursor: String): HistoryOperationResult!
  "Refaz a próxima entrada; actor é atribuído pela borda."
  redo(requestId: String, expectedProjectSessionId: String, historyCursor: String): HistoryOperationResult!
  "Cria e ativa atomicamente; identidade + sequência formam o compare-and-swap."
  projectCreate(projectId: String, templateId: String, expectedProjectSessionId: String, expectedCommandSequence: String): ProjectOperationResult!
  "Prepara fora da sessão ativa e substitui somente a identidade/revisão observada."
  projectOpenDocument(document: JSON!, expectedProjectSessionId: String, expectedCommandSequence: String): ProjectOperationResult!
  "Fecha somente a identidade/revisão observada, quando informada."
  projectClose(expectedProjectSessionId: String, expectedCommandSequence: String): ProjectStatus!
  "Alias legado transacional de projectOpenDocument."
  loadDocument(document: JSON!, expectedProjectSessionId: String, expectedCommandSequence: String): ReplaySummary!
  "Alias legado transacional de projectCreate(templateId: ...)."
  newProjectFromTemplate(templateId: String!, expectedProjectSessionId: String, expectedCommandSequence: String): NewProjectResult!
  assetImport(input: AssetImportInput!): AssetOperationResult!
  assetReimport(assetId: String!, operationId: String): AssetOperationResult!
  assetRemove(assetId: String!): AssetRemoveResult!
  assetConfigureTools(input: AssetToolConfigurationInput!): AssetToolConfiguration!
  assetRevealSource(reference: AssetSourceReferenceInput!): AssetRevealResult!
  assetRevealOutput(assetId: String!): AssetRevealResult!
  assetCancel(operationId: String!): AssetCancelResult!
}
